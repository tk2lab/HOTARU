path: benchmark
simdata: ???
min_corr: ???
min_pnr: ???
num_refit: 1

radius: 5.0
tau: 0.16
order: 2
merge_thresh: 0.7

cluster:
  backend: multiprocessing
  n_processes: null

params:
  init:
    method_init: 'corr_pnr'
    normalize_init: false
    center_psf: true
    nb: 0
    gSig:
      - ${radius}
      - ${radius}
    gSiz: null
    min_corr: ${min_corr}
    min_pnr: ${min_pnr}
    K: null
    ring_size_factor: 1.4
    tsub: 1
    ssub: 1
    ssub_B: 2
  data:
    decay_time: ${tau}
  preprocess:
    p: ${order}
  temporal:
    method_deconvolution: oasis
    p: ${order}
  spatial:
    update_background_components: true
  merging:
    merge_thr: ${merge_thresh}
  patch:
    low_rank_background: null
    only_init: true
    del_duplicates: true
    nb_patch: 0
    rf: 50
    stride: 25
  quality:
    use_cnn: false
    SNR_lowest: 0.0
    min_SNR: 0.0
    rval_lowest: -1.0
    rval_thr: -1.0

detrend:
  quantileMin: 8
  frames_window: 250
  flag_auto: false
  use_residuals: false

hydra:
  run:
    dir: ${path}/${simdata}/caiman/${hydra.job.override_dirname}
  sweep:
    dir: ${path}/${simdata}/caiman
    subdir: ${hydra.job.override_dirname}
  output_subdir: .${now:%Y%m%dT%H%M%S}
  job:
    chdir: true
    config:
      override_dirname:
        exclude_keys:
          - simdata
          - cluster.backend
          - cluster.n_processes
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.output_subdir}.log
        level: DEBUG
      console:
        level: WARN
    loggers:
      py.warnings:
        handlers:
          - file
        propagate: false
