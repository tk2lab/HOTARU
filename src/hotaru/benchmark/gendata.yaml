path: benchmark
seed: ???

shape:
  num_frames: 6000
  height: 300
  width: 400
  hz: 20.0

cell:
  num: 500
  radius_m: 10.0
  radius_s: 0.05
  overwrap: 0.4
  intensity_mm: 1.0
  intensity_mb: 0.5
  intensity_s: 0.1
  isi_mm: 2.0
  isi_ms: 0.2
  isi_sm: 1.0
  isi_ss: 0.1
  tau1: 0.08
  tau2: 0.16
  upsample_factor: 10
  noise: 0.1

dendrite:
  num: 2000
  radius_m1: 10.0
  radius_m2: 40.0
  radius_s: 0.2
  tau: 0.6
  noise: 0.25
  beta: 0.1
  num_mix: 10

neuropil:
  scale: 400
  n_basis: 7
  tau: 1.0

output:
  w_dendrite: 0.5
  w_neuropil: 0.5
  poisson_base: 1.0
  poisson_intensity: 0.1
  gauss_intensity: 1.0 

hydra:
  run:
    dir: ${path}/${hydra.job.override_dirname}
  sweep:
    dir: ${path}
    subdir: ${hydra.job.override_dirname}
  output_subdir: .${now:%Y%m%dT%H%M%S}
  job:
    chdir: true
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${hydra.output_subdir}.log
    loggers:
      jax:
        level: WARN
        propagate: false
